services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      observability:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV}
      INSTANCE_TENANT_ID: ${INSTANCE_TENANT_ID}
      INSTANCE_REGION: ${INSTANCE_REGION}
      KERNEL_MOCK_ENABLED: ${KERNEL_MOCK_ENABLED:-0}
      KERNEL_BASE_URL: ${KERNEL_BASE_URL:-}
      KERNEL_SERVICE_TOKEN: ${KERNEL_SERVICE_TOKEN:-}
      LBX_BASE_URL: ${LBX_BASE_URL:-}
      LBX_SERVER_USERNAME: ${LBX_SERVER_USERNAME:-}
      LBX_SERVER_PASSWORD: ${LBX_SERVER_PASSWORD:-}
      LBX_WIDGET_SIGNING_SECRET: ${LBX_WIDGET_SIGNING_SECRET:-}
      LBX_SELLER_ORGANIZATION_ID: ${LBX_SELLER_ORGANIZATION_ID:-}
      LBX_CURRENCY_ID: ${LBX_CURRENCY_ID:-1}
      LBX_CURRENCY: ${LBX_CURRENCY:-RUB}
      LBX_CONNECT_TIMEOUT_SECONDS: ${LBX_CONNECT_TIMEOUT_SECONDS:-1}
      LBX_READ_TIMEOUT_SECONDS: ${LBX_READ_TIMEOUT_SECONDS:-2}
      LBX_MAX_RESPONSE_BYTES: ${LBX_MAX_RESPONSE_BYTES:-524288}
      LBX_MAX_GET_ATTEMPTS: ${LBX_MAX_GET_ATTEMPTS:-5}
      LBX_RETRY_DELAY_SECONDS: ${LBX_RETRY_DELAY_SECONDS:-0.1}
      LBX_MAX_RETRY_DELAY_SECONDS: ${LBX_MAX_RETRY_DELAY_SECONDS:-2}
      MAPPING_OPERATOR_LOCK_FILE: ${MAPPING_OPERATOR_LOCK_FILE:-/run/payments-portal/operator.lock}
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-support@any-tool-ai.ru}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://observability:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-payment-portal-api}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge
    ports:
      - "${WEB_PORT}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/ru').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    depends_on:
      web:
        condition: service_healthy
    environment:
      WEB_UPSTREAM: web:3000

  observability:
    image: ${OTEL_LGTM_IMAGE:-grafana/otel-lgtm:0.30.1}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend
    ports:
      - "${GRAFANA_PORT}:3000"
      - "${LOKI_PORT}:3100"
      - "${PROMETHEUS_PORT}:9090"
      - "${TEMPO_PORT}:3200"
      - "${OTLP_GRPC_PORT}:4317"
      - "${OTLP_HTTP_PORT}:4318"
