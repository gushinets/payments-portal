# Disposable test server, separate from the persistent development PostgreSQL.
services:
  postgres:
    image: postgres:18.4-alpine3.22@sha256:774521500f4c22761b25a6bdb772a0a3c2e8dd32468210bdad9231c5752ea398
    restart: "no"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-anytoolai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anytoolai-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT_TEST:?Run test-db up through scripts/repo.py}:5432"
    tmpfs:
      - /var/lib/postgresql:rw,size=2147483648
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 1s
      timeout: 5s
      retries: 30
