services:
  var-run-short-syntax:
    image: alpine:3.22
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  run-short-syntax:
    image: alpine:3.22
    volumes:
      - /run/docker.sock:/run/docker.sock
  var-run-long-syntax:
    image: alpine:3.22
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
  run-long-syntax:
    image: alpine:3.22
    volumes:
      - type: bind
        source: /run/docker.sock
        target: /var/run/docker.sock
