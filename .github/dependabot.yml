version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Moscow"
    groups:
      npm-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "ANY-84 -"

  - package-ecosystem: "uv"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Moscow"
    groups:
      python-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "ANY-84 -"

  - package-ecosystem: "docker"
    directories:
      - "/apps/api"
      - "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Moscow"
    groups:
      docker-images:
        patterns: ["*"]
    commit-message:
      prefix: "ANY-84 -"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Moscow"
    groups:
      compose-images:
        patterns: ["*"]
    commit-message:
      prefix: "ANY-84 -"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Moscow"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ANY-84 -"
