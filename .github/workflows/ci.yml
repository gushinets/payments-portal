name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      UV_PYTHON_DOWNLOADS: "never"
      APP_PUBLIC_BASE_URL: https://payments.example.test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.1"
          cache: npm
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Validate API dependency lock
        run: uv lock --directory apps/api --check --no-build
      - name: Install API dependencies
        run: uv sync --directory apps/api --locked --dev --no-build --python 3.12
      - name: Install web dependencies
        run: npm run deps:install
      - name: Check provisional Kernel spec, HTTP mock and Portal consumer
        run: ./.venv/bin/python scripts/check_kernel_manifest_contract.py --local
      - name: Run fast checks with coverage
        run: npm run check:fast -- --coverage
      - name: Upload API coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .harness/coverage/api/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload frontend component coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-component-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .harness/coverage/web-components/
          if-no-files-found: warn
          retention-days: 7
      - name: Type-check web
        run: npm run typecheck:web
      - name: Build web
        run: npm run build:web

  production-gate:
    name: Production gate
    runs-on: ubuntu-latest
    # Temporary headroom until ANY-822 optimizes test execution.
    timeout-minutes: 30
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      UV_PYTHON_DOWNLOADS: "never"
      CI_ARTIFACTS: .harness/ci
      COMPOSE_PROJECT_NAME: payment-portal-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_DB: payment_portal_test
      POSTGRES_USER: anytoolai
      API_PORT: "8000"
      WEB_PORT: "3000"
      NEXT_PUBLIC_API_BASE_URL: https://payments.example.test
      CORS_ALLOW_ORIGINS: https://payments.example.test
      APP_ENV: production
      INSTANCE_TENANT_ID: anytoolai
      INSTANCE_REGION: ru
      APP_PUBLIC_BASE_URL: https://payments.example.test
      CADDY_DOMAIN: payments.example.test
      POSTGRES_PASSWORD: ci-local-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    services:
      postgres:
        image: postgres:18.4-alpine3.22@sha256:774521500f4c22761b25a6bdb772a0a3c2e8dd32468210bdad9231c5752ea398
        env:
          POSTGRES_DB: payment_portal_test
          POSTGRES_USER: anytoolai
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql:rw,size=2g
          --health-cmd "pg_isready -U anytoolai -d payment_portal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Validate API dependency lock
        run: uv lock --directory apps/api --check --no-build
      - name: Install API dependencies
        run: uv sync --directory apps/api --locked --dev --no-build --python 3.12
      - name: Create private CI environment
        shell: bash
        run: |
          mkdir -p "$CI_ARTIFACTS"
          ci_env="$RUNNER_TEMP/payment-portal-ci.env"
          application_database_url="postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}"
          test_database_url="postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}_tests"
          echo "::add-mask::$application_database_url"
          echo "::add-mask::$test_database_url"
          {
            echo "TEST_POSTGRES_DATABASE_URL=$test_database_url"
            echo "DATABASE_URL=$application_database_url"
            echo "POSTGRES_DB=$POSTGRES_DB"
            echo "POSTGRES_USER=$POSTGRES_USER"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "POSTGRES_HOST=$POSTGRES_HOST"
            echo "POSTGRES_PORT=$POSTGRES_PORT"
            echo "POSTGRES_HOST_AUTH_METHOD=trust"
            echo "APP_ENV=$APP_ENV"
            echo "INSTANCE_TENANT_ID=$INSTANCE_TENANT_ID"
            echo "INSTANCE_REGION=$INSTANCE_REGION"
            echo "APP_PUBLIC_BASE_URL=$APP_PUBLIC_BASE_URL"
            echo "API_PORT=$API_PORT"
            echo "WEB_PORT=$WEB_PORT"
            echo "NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL"
            echo "CORS_ALLOW_ORIGINS=$CORS_ALLOW_ORIGINS"
            echo "CADDY_DOMAIN=$CADDY_DOMAIN"
          } > "$ci_env"
          echo "CI_ENV_FILE=$ci_env" >> "$GITHUB_ENV"
      - name: Run PostgreSQL tests and migration cycles
        shell: bash
        run: |
          set -a
          source "$CI_ENV_FILE"
          set +a
          exec python scripts/repo.py test api-postgres --workers 4 \
            --junitxml="$CI_ARTIFACTS/postgres-junit.xml" \
            > "$CI_ARTIFACTS/postgres-pytest.log" 2>&1
      - name: Upload PostgreSQL test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_ARTIFACTS }}/postgres-junit.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Validate Compose configuration
        shell: bash
        run: |
          set -a
          source "$CI_ENV_FILE"
          set +a
          python scripts/repo.py validate-production-env
          docker compose --env-file "$CI_ENV_FILE" -f docker-compose.yml config --quiet
          docker compose --env-file "$CI_ENV_FILE" -f docker-compose.prod.yml config --quiet
      - name: Build production images
        shell: bash
        run: |
          docker compose --progress plain --env-file "$CI_ENV_FILE" \
            -f docker-compose.prod.yml build api web \
            2>&1 | tee "$CI_ARTIFACTS/production-build.log"
      - name: Smoke API image
        shell: bash
        run: |
          api_image="${COMPOSE_PROJECT_NAME}-api"
          docker image inspect "$api_image" > /dev/null
          docker run --rm --network host \
            --env-file "$CI_ENV_FILE" "$api_image" \
            python -m alembic -c apps/api/alembic.ini upgrade head
          docker run --detach --name payment-portal-api-smoke --network host \
            --env-file "$CI_ENV_FILE" "$api_image"

          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail \
              http://127.0.0.1:8000/api/health/ready \
              | python -c 'import json, sys; assert json.load(sys.stdin)["status"] == "ready"'; then
              exit 0
            fi
            if ! docker container inspect --format '{{.State.Running}}' \
              payment-portal-api-smoke 2>/dev/null | grep --quiet true; then
              exit 1
            fi
            sleep 2
          done
          exit 1
      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p "$CI_ARTIFACTS"
          docker logs payment-portal-api-smoke \
            > "$CI_ARTIFACTS/api-container.log" 2>&1 || true
          docker logs "${{ job.services.postgres.id }}" \
            > "$CI_ARTIFACTS/postgres-container.log" 2>&1 || true
          docker ps --all --format '{{.Names}}\t{{.Image}}\t{{.Status}}' \
            > "$CI_ARTIFACTS/docker-containers.txt" || true
      - name: Upload failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-gate-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .harness/ci/
            .harness/api-tests/
          if-no-files-found: warn
          retention-days: 7
      - name: Stop smoke container
        if: always()
        run: docker rm --force payment-portal-api-smoke 2>/dev/null || true

  harness-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - if: runner.os == 'Windows'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.1"
          cache: npm
      - if: runner.os == 'Windows'
        run: npm run deps:install
      - if: runner.os == 'Windows'
        run: npm run test:install-policy
      - if: runner.os == 'Windows'
        run: node --test apps/web/tests/typescript-tooling.test.mjs
      - run: python scripts/repo.py harness-smoke
      - name: Check Windows test launcher exit status
        if: runner.os == 'Windows'
        run: |
          python -m venv --without-pip .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import subprocess, sys; result = subprocess.run([sys.executable, 'scripts/repo.py', 'test', '--invalid-option']); assert result.returncode == 2, result.returncode"
      - name: Set up uv for Windows wheel checks
        if: runner.os == 'Windows'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: false
      - name: Install locked Windows API wheels
        if: runner.os == 'Windows'
        run: npm run sync:api
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/portal-uv-wheel-check
      - name: Verify Windows wheel-only policy
        if: runner.os == 'Windows'
        run: .venv/Scripts/python.exe -m pytest apps/api/tests/test_dependency_install_policy.py -q
      - run: python scripts/repo.py pr-metadata
        env:
          PR_TITLE: ANY-108 - Validate harness
          PR_BODY: |
            ## Linear issue
            https://linear.app/paveldik/issue/ANY-108

  browser:
    runs-on: ubuntu-latest
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      UV_PYTHON_DOWNLOADS: "never"
      PLAYWRIGHT_BACKEND_CALLBACKS: '[{"consumer_id":"synthetic-summary","callback_url":"https://summary.invalid/callback"}]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Reserve isolated browser ports
        run: python -m scripts.ci_browser_ports reserve
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Validate API dependency lock
        run: uv lock --directory apps/api --check --no-build
      - name: Install API dependencies
        run: uv sync --directory apps/api --locked --no-dev --no-build --python 3.12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm run deps:install
      - run: npm run playwright:install -- --with-deps
      - run: npm run test:e2e:react-runtime
      - run: python scripts/repo.py up
      - run: npm run test:e2e
      - name: Collect browser port diagnostics
        if: failure() || cancelled()
        run: python -m scripts.ci_browser_ports diagnose
      - name: Upload browser port diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-port-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .harness/browser-ports/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Validate browser evidence
        if: always()
        shell: bash
        run: |
          missing=0
          results_root=".harness/playwright-react-runtime-results"

          for project in desktop-chromium mobile-chromium; do
            complete_attempt=0
            attempts=0
            missing_files=""

            for attempt_dir in \
              "$results_root"/*-"$project" \
              "$results_root"/*-"$project"-retry*; do
              if [ ! -d "$attempt_dir" ]; then
                continue
              fi

              attempt_name="${attempt_dir##*/}"
              case "$attempt_name" in
                *-"$project") ;;
                *-"$project"-retry*)
                  retry_number="${attempt_name##*-${project}-retry}"
                  case "$retry_number" in
                    ""|*[!0-9]*) continue ;;
                  esac
                  ;;
                *) continue ;;
              esac

              attempts=$((attempts + 1))
              attempt_complete=1
              # Current provider-independent Portal runtime evidence; retired
              # routes are covered separately by the no-redirect 404 tests.
              for screenshot in landing account; do
                evidence_file="${attempt_dir}/${screenshot}.png"
                if [ ! -f "$evidence_file" ] || [ ! -s "$evidence_file" ]; then
                  attempt_complete=0
                  missing_files="${missing_files} ${evidence_file}"
                fi
              done

              if [ "$attempt_complete" -eq 1 ]; then
                complete_attempt=1
                break
              fi
            done

            if [ "$complete_attempt" -ne 1 ]; then
              echo "::error::Expected one complete browser evidence attempt for ${project}; inspected ${attempts}.${missing_files}"
              missing=1
            fi
          done

          for report in \
            ".harness/playwright-react-runtime-report/results.json" \
            ".harness/playwright-react-runtime-report/html/index.html" \
            ".harness/playwright-report/results.json" \
            ".harness/playwright-report/html/index.html"; do
            if [ ! -f "$report" ] || [ ! -s "$report" ]; then
              echo "::error::Missing browser evidence file: ${report}"
              missing=1
            fi
          done

          exit "$missing"
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-evidence
          path: |
            .harness/playwright-react-runtime-results/
            .harness/playwright-react-runtime-report/
            .harness/playwright-results/
            .harness/playwright-report/
          include-hidden-files: true
          if-no-files-found: error
      - name: Stop isolated stack
        if: always()
        run: python scripts/repo.py down
