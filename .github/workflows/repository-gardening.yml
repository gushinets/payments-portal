name: Repository gardening

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run repository audit
        id: audit
        continue-on-error: true
        run: |
          python scripts/repo.py docs check 2>&1 | tee gardening-report.txt
          python scripts/repo.py architecture check 2>&1 | tee -a gardening-report.txt
      - name: Open or update maintenance issue
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = "[Gardening] Repository quality drift detected";
            const fs = require("fs");
            const report = fs.readFileSync("gardening-report.txt", "utf8").slice(0, 60000);
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open"
            });
            const existing = data.find(issue => issue.title === title);
            const body = `Scheduled agent-legibility checks failed.\n\n\`\`\`text\n${report}\n\`\`\``;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
