name: Build selected images
on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to build
        type: choice
        options: [backend, frontend, all]
        default: backend
      publish:
        description: Publish to GHCR after review (requires separate authorization)
        type: boolean
        default: false
      portal_origin:
        description: Portal public origin (frontend build)
        type: string
      portal_api_origin:
        description: Portal browser API origin (frontend build)
        type: string
      sentry_dsn:
        description: Optional public Sentry DSN
        type: string
permissions:
  contents: read
  packages: write
jobs:
  api:
    if: inputs.component == 'all' || inputs.component == 'backend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build immutable selection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/$owner/payments-portal-api:${GITHUB_SHA}"
          docker build --file apps/api/Dockerfile --target production \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image" .
          docker image inspect --format '{{.Id}}' "$image" >> "$GITHUB_STEP_SUMMARY"
          echo "$image" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PUBLISH" = true ]; then
            printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
            docker push "$image"
          fi
  web:
    if: inputs.component == 'all' || inputs.component == 'frontend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build immutable selection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ inputs.publish }}
          APP_PUBLIC_BASE_URL: ${{ inputs.portal_origin }}
          NEXT_PUBLIC_API_BASE_URL: ${{ inputs.portal_api_origin }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ inputs.sentry_dsn }}
        run: |
          set -euo pipefail
          test -n "$APP_PUBLIC_BASE_URL"
          test -n "$NEXT_PUBLIC_API_BASE_URL"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/$owner/payments-portal-web:${GITHUB_SHA}-${GITHUB_RUN_ID}"
          docker build --file apps/web/Dockerfile --target runtime \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --build-arg "APP_PUBLIC_BASE_URL=$APP_PUBLIC_BASE_URL" \
            --build-arg "NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL" \
            --build-arg "NEXT_PUBLIC_SENTRY_DSN=$NEXT_PUBLIC_SENTRY_DSN" \
            --tag "$image" .
          docker image inspect --format '{{.Id}}' "$image" >> "$GITHUB_STEP_SUMMARY"
          echo "$image" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PUBLISH" = true ]; then
            printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
            docker push "$image"
          fi
